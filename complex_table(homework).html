<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMEWORK TABLE</title>
</head>
<body>
  <table width="500px" border="1">
    <thead>
        <tr>
         <th rowspan="3" width="100px" >Day</th>
         <th colspan="8">Seminar</th>
       </tr>
       <tr>
         <th colspan="2">Schedule</th>
         <th rowspan="2" colspan="3">Topic</th>
       </tr>
       <tr>
         <th width="100px">Begin</th>
         <th width="100px">End</th>
       </tr>
    </thead>
    <tbody>
        <tr>
            <td height="50" style="text-align: center;">Monday</td>
            <td height="50" style="text-align: center;">8:00 a.m</td>
            <td height="50" style="text-align: center;">5:00 p.m</td>
            <td height="20" style="text-align: center;">Introduction to XML</td> 
        </tr>
    </tbody>
    
  </table>
</body>
</html>
